# Default configuration. Every key is optional: anything omitted falls back to
# the defaults in src/soccer_tracker/config.py. Unknown keys are rejected.
# Relative paths are resolved against the directory you run the command from.

io:
  output_video: outputs/annotated.mp4
  output_csv: outputs/tracks.csv
  output_summary: outputs/summary.json
  fourcc: mp4v            # mp4v/avc1 for .mp4, XVID/MJPG for .avi
  fallback_fps: 25.0      # used only if the video reports no valid FPS
  max_frames: null        # e.g. 300 for a quick test
  log_every: 50
  overwrite: true

players:
  detector:
    # Official Ultralytics COCO weights; downloaded automatically on first use
    # if allow_download is true. Swap for a soccer-specific model for better results.
    weights: weights/yolo11n.pt
    classes: [person]
    confidence: 0.15      # keep below tracker.high_conf_det_threshold so ByteTrack's
                          # second (low-confidence) association stage has input
    iou: 0.5
    imgsz: 1280           # broadcast players are small; 640 misses distant players
    device: null          # null = auto; "cpu", "0" (first CUDA GPU), "mps"
    half: false
    allow_download: true
    tiling:
      enabled: false
  filter:
    min_height_px: 12
    max_height_frac: 0.6
    min_aspect: 0.8       # box height / width
    max_aspect: 6.0
    use_pitch_mask: false # true = drop boxes whose feet are not on grass (removes crowd)
  tracker:                # Roboflow `trackers` package
    algorithm: bytetrack  # bytetrack (proposed) | sort | ocsort (baselines)
    track_activation_threshold: 0.5
    high_conf_det_threshold: 0.5
    minimum_iou_threshold: 0.1
    lost_track_buffer: 30
    minimum_consecutive_frames: 3

ball:
  enabled: true
  # Reuse the player YOLO pass when weights/imgsz/device match and tiling is
  # off (about 2x faster). Set false to always run a separate ball pass.
  share_player_inference: true
  detector:
    # The COCO "sports ball" class is a weak baseline for broadcast footage.
    # See README "Ball detection" for soccer-specific weights.
    weights: weights/yolo11n.pt
    classes: ["sports ball"]
    confidence: 0.1       # low on purpose: the ball tracker rejects false positives
    iou: 0.3
    imgsz: 1280
    device: null
    half: false
    allow_download: true
    tiling:               # sliced inference; better for tiny balls, ~N times slower
      enabled: false
      tile_size: 640
      overlap: 0.2
      include_full_frame: true
  filter:
    min_size_px: 2
    max_size_px: 80
    max_aspect_ratio: 2.0
    use_pitch_mask: false
  tracker:                # constant-velocity Kalman single-target tracker
    gate_px: 80
    gate_growth_px: 20
    max_gate_px: 160      # cap on the widened gate
    max_missed_frames: 6  # coast at most ~0.2 s; longer extrapolations drift badly
    start_confidence: 0.3 # weak detections can extend a track but never start one
    max_coast_innovation_px: 15  # no predicted ball right after a sudden jump (a kick)
    flight_anchor_px: 35  # a motion flight must trace back to where the ball was last seen...
    flight_max_anchor_gap: 10  # ...at most this many frames earlier
    flight_unanchored_min_length: 0  # 0 = never adopt a flight that does not trace back to the ball
    flight_continue_px: 20
    min_hits: 2
    reinit_confidence: 0.5
    reinit_after_missed: 3
    process_noise: 4.0
    measurement_noise: 4.0
    trajectory_length: 90
  motion:                 # ball in flight: motion-blurred, missed by YOLO (detection/motion.py)
    enabled: true
    confidence: 0.2
    diff_threshold: 25    # grey-level change that counts as motion (after camera-motion compensation)
    min_value: 150        # the ball is bright...
    max_saturation: 90    # ...and pale
    min_area_px: 6
    max_area_px: 400
    max_side_px: 35
    max_aspect_ratio: 3.5 # blur stretches the ball into a short streak
    orb_features: 1500
    link_min_step_px: 4   # linking blobs into flights (tracking/flight.py)
    link_max_step_px: 60
    link_radius_px: 6
    link_radius_speed_gain: 0.25
    link_max_misses: 1
    link_max_chains: 2000
    flight_min_length: 6  # a flight needs this many points...
    flight_min_speed_px: 8   # ...this median speed (px/frame)...
    flight_max_accel_px: 4   # ...and must be smooth: median velocity change at most
    flight_max_accel_frac: 0.3  # max(this px, this fraction of the speed)
    backfill_frames: 8    # output is held this many frames to fill in the start of a flight

pitch_mask:
  hsv_lower: [30, 40, 40]
  hsv_upper: [90, 255, 255]
  dilate_px: 25

visualization:
  draw_player_boxes: true
  draw_player_ids: true
  draw_player_trajectories: true
  player_trajectory_length: 40
  draw_ball: true
  draw_ball_trajectory: true
  show_predicted_ball: true
  draw_hud: true
  line_thickness: 2
  font_scale: 0.5
