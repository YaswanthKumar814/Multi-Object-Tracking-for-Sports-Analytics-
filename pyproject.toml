[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-tracker"
version = "0.1.0"
description = "Soccer player and ball detection/tracking for sports video analytics (course project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "PyYAML>=6.0",
    "ultralytics>=8.3,<9",
    "supervision>=0.26",
    "trackers>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
soccer-tracker = "soccer_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs real YOLO weights (downloaded or present locally); skipped otherwise",
]
